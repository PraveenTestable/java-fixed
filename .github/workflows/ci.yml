name: Whitebox CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  # ── Tests + JaCoCo coverage (argLine is in pom.xml via @{argLine}) ──────────
  coverage:
    name: Tests + JaCoCo Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Run tests with JaCoCo
        run: mvn -B test --file pom.xml
      - name: Upload JaCoCo XML
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-xml
          path: target/site/jacoco/jacoco.xml
          retention-days: 14
      - name: Upload JaCoCo HTML
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-html
          path: target/site/jacoco/
          retention-days: 14

  # ── Mutation testing (PITest) ────────────────────────────────────────────────
  mutation:
    name: Mutation Testing (PITest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Run mutation tests
        run: mvn -B test org.pitest:pitest-maven:mutationCoverage --file pom.xml
      - name: Upload PITest XML
        uses: actions/upload-artifact@v4
        with:
          name: pitest-report
          path: target/pit-reports/
          retention-days: 14

  # ── Static analysis (PMD + Checkstyle + SpotBugs) ───────────────────────────
  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Compile
        run: mvn -B test-compile --file pom.xml
      - name: SpotBugs SAST
        run: mvn -B spotbugs:spotbugs --file pom.xml
      - name: PMD lint and complexity
        run: mvn -B pmd:pmd pmd:cpd --file pom.xml
      - name: Checkstyle naming and style
        run: mvn -B checkstyle:checkstyle --file pom.xml
      - name: Upload SpotBugs XML
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-xml
          path: target/spotbugsXml.xml
          retention-days: 14
      - name: Upload PMD XML
        uses: actions/upload-artifact@v4
        with:
          name: pmd-xml
          path: target/pmd.xml
          retention-days: 14
      - name: Upload Checkstyle XML
        uses: actions/upload-artifact@v4
        with:
          name: checkstyle-xml
          path: target/checkstyle-result.xml
          retention-days: 14

  # ── SCA - OWASP Dependency Check ────────────────────────────────────────────
  dependency-check:
    name: SCA OWASP Dependency Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: OWASP Dependency Check
        run: mvn -B org.owasp:dependency-check-maven:check --file pom.xml
        continue-on-error: true
      - name: Upload OWASP DC report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: target/dependency-check-report.*
          retention-days: 14
