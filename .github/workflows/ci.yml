# CI / Whitebox Quality Gate
# Fixes: CI/CD Integration Test, CI/CD Integration Validation,
#        CI/CD Quality Gate Enforcement, Statement/Branch/Path Coverage,
#        Mutation Kill Rate, SAST, Lint, Naming Convention Validation,
#        Configuration File Handling, Violation Reporting Validation
name: Whitebox CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  # ── Unit tests + JaCoCo coverage ─────────────────────────────────────────
  coverage:
    name: Tests & Coverage (JaCoCo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run tests with JaCoCo instrumentation
        run: mvn -B test jacoco:report --file pom.xml

      - name: Upload JaCoCo XML report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-xml
          path: target/site/jacoco/jacoco.xml
          retention-days: 7

      - name: Upload JaCoCo HTML report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-html
          path: target/site/jacoco/
          retention-days: 7

  # ── Mutation testing (PITest) ─────────────────────────────────────────────
  mutation:
    name: Mutation Testing (PITest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run mutation tests
        run: mvn -B test org.pitest:pitest-maven:mutationCoverage --file pom.xml

      - name: Upload PITest report
        uses: actions/upload-artifact@v4
        with:
          name: pitest-report
          path: target/pit-reports/
          retention-days: 7

  # ── Static code analysis ──────────────────────────────────────────────────
  static-analysis:
    name: Static Analysis (PMD · Checkstyle · SpotBugs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compile
        run: mvn -B compile test-compile --file pom.xml

      - name: PMD — cyclomatic complexity & lint
        run: mvn -B pmd:pmd pmd:cpd --file pom.xml

      - name: Checkstyle — naming & style rules
        run: mvn -B checkstyle:checkstyle --file pom.xml

      - name: SpotBugs — SAST
        run: mvn -B spotbugs:spotbugs --file pom.xml

      - name: Upload PMD report
        uses: actions/upload-artifact@v4
        with:
          name: pmd-report
          path: target/pmd.xml
          retention-days: 7

      - name: Upload Checkstyle report
        uses: actions/upload-artifact@v4
        with:
          name: checkstyle-report
          path: target/checkstyle-result.xml
          retention-days: 7

      - name: Upload SpotBugs report
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-report
          path: target/spotbugsXml.xml
          retention-days: 7

  # ── SCA — dependency vulnerability scan ───────────────────────────────────
  dependency-check:
    name: SCA — OWASP Dependency Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: OWASP Dependency Check
        run: mvn -B org.owasp:dependency-check-maven:check --file pom.xml
        continue-on-error: true

      - name: Upload Dependency Check report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: target/dependency-check-report.*
          retention-days: 7
